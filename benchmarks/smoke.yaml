# yaml-language-server: $schema=https://raw.githubusercontent.com/vcoderun/autobench/415c2e6100e85b5671f9f045ca6dc4e4c78f081c/schemas/0.3.0/benchmark_schema.json
benchmark:
  stack-smoke:
    description: Offline GEPA optimization of a Pydantic AI agent with native Autobench evidence.
    cases:
      - id: instruction-injection
        input: {}
        expected:
          candidate: Return ready.
          score: 1.0
          baseline_after_optimization: unknown
        tags: [offline, integration]
    run:
      python: freya_hackathon.smoke:run
    variants:
      offline:
        factors:
          model:
            value: function
            optimize: false
    instrumentation:
      pydantic_gepa:
        detail: full
        assets:
          discover: true
          representations: [definition, effective]
      pydantic_ai: {}
    score:
      candidate:
        exact:
          actual: output.candidate
          expected: case.expected.candidate
        semantic: quality.correctness
        goal: maximize
        role: objective
      optimized_score:
        exact:
          actual: output.score
          expected: case.expected.score
        semantic: quality.correctness
        goal: maximize
      injection_isolation:
        exact:
          actual: output.baseline_after_optimization
          expected: case.expected.baseline_after_optimization
        semantic: quality.correctness
        goal: maximize
